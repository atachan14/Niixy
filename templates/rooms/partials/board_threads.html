<div class="room-board-thread-list" data-board-id="{{ board.pk }}" data-board-name="{{ board.name }}">
  {% if room.is_member %}<details class="ui-control-accordion room-thread-create"><summary>新規作成</summary><div class="ui-control-accordion-body"><form action="{% url 'rooms:board-thread-create' room.pk board.pk %}" data-board-thread-create>{% csrf_token %}<input name="submission_id" type="hidden" value="{{ thread_submission_id }}"><label>タイトル<input name="title" maxlength="120" required></label><label>本文<textarea name="body" rows="5" required></textarea></label>
    <details class="room-thread-module" open><summary>DirectField</summary><div data-room-direct-fields></div><div class="room-thread-module-picker"><select data-room-field-picker aria-label="追加するField"></select><button class="button secondary" type="button" data-add-room-field>Fieldを追加</button></div></details>
    <details class="room-thread-module" open><summary>ThreadIF</summary><div data-room-thread-interfaces></div><div class="room-thread-module-picker"><select data-room-interface-picker aria-label="追加するThreadIF"></select><button class="button secondary" type="button" data-add-room-interface>ThreadIFを追加</button></div></details>
    <details class="room-thread-module"><summary>Policy</summary><div class="room-thread-policy"><fieldset><legend>閲覧</legend><label><input name="view_guest" type="checkbox" value="true" checked>Guest</label><label><input name="view_account" type="checkbox" value="true" checked>NiixyAccount</label></fieldset><fieldset><legend>書き込み</legend><label><input name="write_guest" type="checkbox" value="true">Guest</label><label><input name="write_account" type="checkbox" value="true" checked>NiixyAccount</label></fieldset></div></details>
    <p class="room-form-error" hidden></p><button class="button primary" type="submit" data-pending-label="作成中...">作成する</button></form></div></details>{% endif %}
  <div class="ui-summary-list">{% for thread in threads %}<button class="ui-summary-item" type="button" data-room-thread="{{ thread.pk }}"><span class="ui-summary-item-context" aria-hidden="true"></span><strong class="ui-summary-item-title">{{ thread.title }} ({{ thread.posts.all|length }})</strong><small class="ui-summary-item-updated">最終更新 {{ thread.last_activity_at|date:'Y/m/d H:i' }}</small></button>{% empty %}<p class="empty">まだThreadはありません。</p>{% endfor %}</div>
</div>
