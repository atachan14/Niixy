<section class="room-detail-fragment" data-room-fragment data-room-id="{{ room.pk }}" data-room-title="{{ room.name }}" data-room-page-url="{% url 'rooms:detail' room.pk %}" data-members-url="{% url 'rooms:members' room.pk %}" data-boards-url="{% url 'rooms:boards' room.pk %}" data-board-template="{% url 'rooms:board-threads' room.pk 0 %}" data-thread-detail-template="{% url 'rooms:thread-detail' room.pk 0 %}" data-current-account="{{ user.username }}" data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}" data-account-condition-list-url="{% url 'accounts:account-condition-list' %}" data-account-search-url="{% url 'accounts:account-condition-search' %}" data-account-condition-room-search-url="{% url 'accounts:account-condition-room-search' %}" data-account-condition-save-url="{% url 'accounts:account-condition-save' %}" data-account-condition-delete-url="{% url 'accounts:account-condition-delete' 0 %}">
  {% include 'rooms/partials/room_overview.html' with room=room %}
  {{ room_thread_field_catalog|json_script:"room-pane-field-catalog" }}
  {{ room_thread_interface_catalog|json_script:"room-pane-interface-catalog" }}
</section>
