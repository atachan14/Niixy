<div class="room-member-list ui-summary-list">{% for membership in room.memberships.all %}<a class="ui-summary-item" href="{% url 'accounts:detail' membership.account.username %}"><span class="ui-summary-item-context" aria-hidden="true"></span><strong class="ui-summary-item-title">{{ membership.account.niixy_profile.display_label }}{% if membership.account_id == room.owner_id %} / RoomOwner{% endif %}</strong><small class="ui-summary-item-updated">参加 {{ membership.joined_at|date:'Y/m/d H:i' }}</small></a>{% empty %}<p class="empty">参加者はいません。</p>{% endfor %}</div>
