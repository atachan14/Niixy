<section class="ui-pane ui-list-pane add-field-list-pane" data-mypage-pane="add-synonym-list">
  <header class="ui-pane-header ui-list-pane-header interface-pane-header"><h2>片同義Field一覧</h2><button class="icon-button" type="button" data-close-add-synonym aria-label="Field編集へ戻る">×</button></header>
  <div class="ui-tabs interface-tabs" role="tablist" aria-label="片同義Field一覧"><button class="is-active" type="button" role="tab" aria-selected="true" data-ui-tab="search">検索</button><button type="button" role="tab" aria-selected="false" data-ui-tab="created">作成</button><button type="button" role="tab" aria-selected="false" data-ui-tab="saved">保存</button></div>
  <div class="ui-tab-panel is-active" data-ui-tab-panel="search">{% include 'interfaces/field_search_panel.html' %}</div>
  <div class="ui-tab-panel ui-summary-list" data-ui-tab-panel="created">{% for field in created_fields %}{% include 'interfaces/field_summary_item.html' %}{% empty %}<p class="empty">作成したFieldはありません。</p>{% endfor %}</div><div class="ui-tab-panel" data-ui-tab-panel="saved"><p class="empty">保存したFieldはありません。</p></div>
</section>
