<section class="add-require-list-pane" data-mypage-pane="add-require-list">
  <header class="interface-pane-header"><h2>Interface</h2><button class="icon-button" type="button" data-close-add-require aria-label="定義編集へ戻る">×</button></header>
  <div class="interface-tabs" role="tablist" aria-label="RequireするInterface一覧"><button class="is-active" type="button" role="tab" aria-selected="true" data-require-tab="created">作成</button><button type="button" role="tab" aria-selected="false" data-require-tab="saved">保存</button></div>
  <div class="require-picker-list is-active" data-require-list="created">{% for candidate in interface_require_created %}{% include 'interfaces/summary_item.html' with interface=candidate summary_action='require' draft_id=draft.pk %}{% empty %}<p class="empty">作成したInterfaceはありません。</p>{% endfor %}</div>
  <div class="require-picker-list" data-require-list="saved"><p class="empty">保存したInterfaceはありません。</p></div>
</section>
