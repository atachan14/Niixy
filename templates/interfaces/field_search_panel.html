<details class="field-search-controls" open>
  <summary>検索条件</summary>
  <form class="field-search-form" action="{{ field_search_url }}" method="get" data-summary-search-form>
    {% for name, value in field_search_fixed_params.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <div class="field-search-row"><label for="{{ field_search_scope }}-name">名前</label><input id="{{ field_search_scope }}-name" type="search" name="name" value="{{ field_search_filters.name }}" placeholder="Field名@NiixyID"></div>
    <div class="field-search-row"><label for="{{ field_search_scope }}-description">詳細</label><input id="{{ field_search_scope }}-description" type="search" name="description" value="{{ field_search_filters.description }}"></div>
    <div class="field-search-row"><label for="{{ field_search_scope }}-type">型</label><select id="{{ field_search_scope }}-type" name="field_type"><option value="">すべて</option>{% for value, label in field_search_types %}<option value="{{ value }}"{% if field_search_filters.field_type == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="field-search-actions"><button class="button" type="submit">検索</button></div>
  </form>
</details>
{% include 'interfaces/field_search_results.html' %}
