<section class="interface-detail-actions owner-interface-actions interface-definition-actions" aria-label="Action">

    <button class="button secondary" type="submit" form="interface-draft-form" name="action" value="save">中断</button>
    <button class="button" type="submit" form="interface-draft-form" name="action" value="publish">公開</button>

</section>
