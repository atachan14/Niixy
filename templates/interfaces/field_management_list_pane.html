<section class="ui-pane ui-list-pane field-list-pane" data-mypage-pane="field-list">
  <header class="ui-pane-header ui-list-pane-header interface-pane-header"><h2>Field一覧</h2><button class="icon-button" type="button" data-close-field-list aria-label="定義一覧に戻る">×</button></header>
  <div class="ui-tabs interface-tabs" role="tablist" aria-label="Field一覧"><button class="is-active" type="button" role="tab" aria-selected="true" data-ui-tab="created">作成</button><button type="button" role="tab" aria-selected="false" data-ui-tab="saved">保存</button><button type="button" role="tab" aria-selected="false" data-ui-tab="deleted">削除済み</button></div>
  <div class="ui-tab-panel ui-summary-list is-active" data-ui-tab-panel="created"><button class="button" type="button" data-field-create-url="{% url 'interfaces:field-create' %}">新規作成</button>{% for field in active_fields %}<button class="ui-summary-item interface-summary-item" type="button" data-detail-url="{% url 'interfaces:field-detail' field.pk %}"><span></span><strong>{{ field.name }}@{{ field.creator.username }} v{{ field.current_version.version_number }}/Field</strong><small>{{ field.updated_at|date:'Y/m/d H:i' }}</small></button>{% empty %}<p class="empty">公開したFieldはありません。</p>{% endfor %}</div>
  <div class="ui-tab-panel" data-ui-tab-panel="saved"><p class="empty">保存したFieldはありません。</p></div>
  <div class="ui-tab-panel ui-summary-list" data-ui-tab-panel="deleted">{% for field in deleted_fields %}<button class="ui-summary-item interface-summary-item" type="button" data-detail-url="{% url 'interfaces:field-detail' field.pk %}"><span></span><strong>{{ field.name }}@{{ field.creator.username }} v{{ field.current_version.version_number }}/Field</strong><small>{{ field.updated_at|date:'Y/m/d H:i' }}</small></button>{% empty %}<p class="empty">削除済みFieldはありません。</p>{% endfor %}</div>
</section>
