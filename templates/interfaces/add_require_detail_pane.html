<section class="ui-pane ui-detail-pane add-require-detail-pane" data-mypage-pane="add-require-detail" data-require-id="{{ candidate.pk }}">
  <header class="ui-pane-header ui-detail-pane-header interface-pane-header"><h2>{{ candidate.name }}@{{ candidate.creator.username }} v{{ candidate.current_version.version_number }}/{{ candidate.get_kind_display }}</h2><button class="icon-button" type="button" data-back-add-require-list aria-label="Interface一覧へ戻る">×</button></header>
  {% include 'interfaces/definition_detail_content.html' with interface_item=candidate definition_detail_class='require-candidate-detail' %}
  <div class="interface-detail-actions"><button class="button primary add-interface-require" type="button" data-require-id="{{ candidate.pk }}">追加</button></div>
  <template data-require-summary><div class="selected-interface-require" data-selected-require="{{ candidate.pk }}"><span><strong>{{ candidate.name }}@{{ candidate.creator.username }}</strong><small>{{ candidate.get_kind_display }} / v{{ candidate.current_version.version_number }}</small></span><button class="icon-button remove-interface-require" type="button" data-require-id="{{ candidate.pk }}" aria-label="{{ candidate.name }}のRequireを解除">×</button></div></template>
  <template data-require-fields><details class="interface-field-group" data-required-field-group="{{ candidate.pk }}" open><summary>{{ candidate.name }}@{{ candidate.creator.username }}</summary><div class="required-interface-fields">{% for field in candidate.current_version.fields.all %}<div class="required-interface-field"><strong>{{ field.label }}</strong><span>{{ field.get_field_type_display }}{% if field.required %} / 必須{% endif %}</span></div>{% empty %}<p class="empty">Fieldはありません。</p>{% endfor %}</div></details></template>
</section>
