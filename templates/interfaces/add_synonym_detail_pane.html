<section class="ui-pane ui-detail-pane add-field-detail-pane" data-mypage-pane="add-synonym-detail" data-field-id="{{ candidate.pk }}" data-field-name="{{ candidate.name }}" data-field-creator="{{ candidate.creator.username }}" data-field-version="{{ candidate.current_version.version_number }}" data-field-type="{{ candidate.current_version.field_type }}">
  <header class="ui-pane-header ui-detail-pane-header interface-pane-header"><h2>{{ candidate.name }}@{{ candidate.creator.username }} v{{ candidate.current_version.version_number }}/Field</h2><button class="icon-button" type="button" data-back-add-synonym-list aria-label="片同義Field一覧へ戻る">×</button></header>
  <article class="interface-definition-detail">{% if candidate.current_version.description %}<p>{{ candidate.current_version.description|linebreaksbr }}</p>{% endif %}<section class="interface-form-section"><h3>型</h3><p>{{ candidate.current_version.get_field_type_display }}</p></section></article><div class="ui-detail-actions" aria-label="Action"><button class="button" type="button" data-add-synonym>片同義に追加</button></div>
</section>
