{% if field_search_purpose == 'add-field' %}<button class="ui-summary-item interface-summary-item" type="button" data-detail-url="{% url 'interfaces:add-field-detail' field_search_draft.pk field.pk %}">{% elif field_search_purpose == 'add-synonym' %}<button class="ui-summary-item interface-summary-item" type="button" data-detail-url="{% url 'interfaces:add-synonym-detail' field.pk %}">{% else %}<button class="ui-summary-item interface-summary-item module-summary-entry" type="button" data-detail-url="{% url 'interfaces:field-detail' field.pk %}">{% endif %}<span class="ui-summary-item-context" aria-hidden="true"></span><strong class="ui-summary-item-title">{{ field.name }}@{{ field.creator.username }} v{{ field.current_version.version_number }}/Field</strong><small class="ui-summary-item-updated">最終更新 {{ field.updated_at|date:'Y/m/d H:i' }}</small></button>
