<dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-dialog-title">
  <div class="auth-dialog-header">
    <h2 id="auth-dialog-title">新規登録</h2>
    <button id="auth-dialog-close" class="icon-button" type="button" aria-label="閉じる">×</button>
  </div>
  <div class="auth-tabs" role="tablist" aria-label="Account">
    <button type="button" role="tab" aria-selected="true" data-auth-tab="signup">新規登録</button>
    <button type="button" role="tab" aria-selected="false" data-auth-tab="login">ログイン</button>
  </div>

  <form id="signup-form" class="auth-form" method="post" action="{% url 'accounts:signup' %}" novalidate>
    {% csrf_token %}
    <p class="auth-form-error" aria-live="polite" hidden></p>
    <div class="field">
      <label for="signup-username">Niixy ID</label>
      <input id="signup-username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[a-z0-9_]{3,20}" required>
      <p class="field-help">英小文字、数字、_ の3〜20文字</p>
    </div>
    <div class="field">
      <label for="signup-display-name">表示名（任意）</label>
      <input id="signup-display-name" name="display_name" autocomplete="nickname" maxlength="24">
      <p class="field-help">全角12文字、半角24文字相当まで</p>
    </div>
    <div class="field">
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="field-help">8文字以上</p>
    </div>
    <div class="field">
      <label for="signup-password-confirmation">Password（確認）</label>
      <input id="signup-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <p class="auth-note">Email Addressを登録しないため、Passwordを忘れた場合は復旧できません。</p>
    <button class="button primary" type="submit">Accountを作成</button>
  </form>

  <form id="login-form" class="auth-form" method="post" action="{% url 'accounts:login' %}" novalidate hidden>
    {% csrf_token %}
    <p class="auth-form-error" aria-live="polite" hidden></p>
    <div class="field">
      <label for="login-username">Niixy ID</label>
      <input id="login-username" name="username" autocomplete="username" maxlength="20" required>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="button primary" type="submit">ログイン</button>
  </form>
</dialog>
