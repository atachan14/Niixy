<a class="account-summary{% if feature_summary %} ui-summary-item{% else %} muter-summary{% endif %}" href="{% url 'accounts:detail' summary_account.username %}">{% if feature_summary %}<span class="ui-summary-item-context" aria-hidden="true"></span><span class="ui-summary-item-title">{{ summary_account.niixy_profile.display_label }}</span><small class="ui-summary-item-updated">{{ timestamp_label|default:'追加' }} {{ added_at|date:'Y/m/d H:i' }}</small>{% else %}<span>{{ summary_account.niixy_profile.display_label }}</span><time datetime="{{ added_at|date:'c' }}">追加 {{ added_at|date:'Y/m/d H:i' }}</time>{% endif %}</a>
