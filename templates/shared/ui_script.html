<script>
window.NiixyUI = (() => {
  const accordionControllers = new WeakMap();

  function beginPendingAction(button, label = button?.dataset.pendingLabel) {
    if (!button || button.dataset.uiPending === 'true') return null;
    const form = button.form;
    const state = {
      buttonDisabled: button.disabled,
      buttonHtml: button.innerHTML,
      buttonAriaBusy: button.getAttribute('aria-busy'),
      formAriaBusy: form?.getAttribute('aria-busy') ?? null,
    };
    button.dataset.uiPending = 'true';
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    if (form) form.setAttribute('aria-busy', 'true');
    if (label) button.textContent = label;

    return {
      restore() {
        button.disabled = state.buttonDisabled;
        button.innerHTML = state.buttonHtml;
        if (state.buttonAriaBusy === null) button.removeAttribute('aria-busy');
        else button.setAttribute('aria-busy', state.buttonAriaBusy);
        delete button.dataset.uiPending;
        if (form) {
          if (state.formAriaBusy === null) form.removeAttribute('aria-busy');
          else form.setAttribute('aria-busy', state.formAriaBusy);
        }
      },
    };
  }

  async function submitThreadReply(form, submitter = null) {
    const pending = beginPendingAction(submitter || form.querySelector('[type="submit"]'));
    if (!pending) return null;
    const error = form.querySelector('.reply-form-error');
    if (error) error.hidden = true;
    form.dataset.submissionId ||= crypto.randomUUID();
    const data = new FormData(form);
    if (!data.has('submission_id')) data.append('submission_id', form.dataset.submissionId);
    try {
      const response = await fetch(form.action, {method: 'POST', body: data});
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || Object.values(result.errors || {}).flat().join(' ') || '送信に失敗しました。');
      }
      return result;
    } catch (exception) {
      if (error) {
        error.textContent = exception.message || '通信に失敗しました。もう一度お試しください。';
        error.hidden = false;
      }
      pending.restore();
      return null;
    }
  }

  async function fetchFragment(url, selector = null) {
    const response = await fetch(url, {headers: {'X-Requested-With': 'fetch'}});
    if (!response.ok) throw new Error('UI fragment request failed');
    const documentFragment = new DOMParser().parseFromString(await response.text(), 'text/html');
    const fragment = selector ? documentFragment.querySelector(selector) : documentFragment.body.firstElementChild;
    if (!fragment) throw new Error('UI fragment was not found');
    return fragment;
  }

  function createStatusPane({tagName = 'section', className = '', attributes = {}, message = '読み込み中...'}) {
    const pane = document.createElement(tagName);
    pane.className = `ui-pane ${className} is-loading`.trim();
    Object.entries(attributes).forEach(([name, value]) => { pane.dataset[name] = value; });
    const status = document.createElement('p');
    status.className = 'ui-pane-status';
    status.textContent = message;
    pane.append(status);
    return pane;
  }

  function showPaneError(pane, message = '読み込みに失敗しました。') {
    pane.classList.remove('is-loading');
    pane.classList.add('has-load-error');
    pane.replaceChildren();
    const status = document.createElement('p');
    status.className = 'ui-pane-status';
    status.textContent = message;
    pane.append(status);
  }

  function bindTabs(root) {
    root.querySelectorAll('[data-ui-tab]:not([data-ui-tab-bound])').forEach((tab) => {
      tab.dataset.uiTabBound = 'true';
      tab.addEventListener('click', () => {
        root.querySelectorAll('[data-ui-tab]').forEach((item) => {
          const selected = item === tab;
          item.classList.toggle('is-active', selected);
          item.setAttribute('aria-selected', String(selected));
        });
        root.querySelectorAll('[data-ui-tab-panel]').forEach((panel) => {
          panel.classList.toggle('is-active', panel.dataset.uiTabPanel === tab.dataset.uiTab);
        });
      });
    });
  }

  function createPaneStack(element, stages) {
    const stageClasses = [...new Set(Object.values(stages).filter(Boolean))];
    let currentStage = Object.keys(stages).find((stage) => {
      const className = stages[stage];
      return className ? element.classList.contains(className) : false;
    }) || Object.keys(stages).find((stage) => !stages[stage]) || null;

    return {
      get stage() { return currentStage; },
      is(stage) { return currentStage === stage; },
      set(stage) {
        if (!(stage in stages)) throw new Error(`Unknown pane stage: ${stage}`);
        element.classList.remove(...stageClasses);
        if (stages[stage]) element.classList.add(stages[stage]);
        element.dataset.uiPaneStage = stage;
        currentStage = stage;
      },
      append(pane) { element.append(pane); return pane; },
      remove(...selectors) {
        selectors.forEach((selector) => element.querySelector(selector)?.remove());
      },
    };
  }

  function createWorkspace(viewport, stages, {track = viewport.firstElementChild} = {}) {
    let currentStage = Object.keys(stages)[0] || null;
    let resizeFrame = null;

    const align = () => {
      // Workspace positioning is controlled only by the track transform.
      // Native horizontal scrolling can be introduced by scrollIntoView().
      viewport.scrollLeft = 0;
      const definition = stages[currentStage];
      if (!definition || definition.root) {
        viewport.dataset.uiWorkspaceWidth = 'full';
        track.style.setProperty('--ui-workspace-offset', '0px');
        return;
      }
      const target = typeof definition.target === 'string' ? track.querySelector(definition.target) : definition.target;
      if (!target) return;
      const width = definition.width || 'remaining';
      const trackRect = track.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const offset = width === 'full'
        ? Math.max(0, targetRect.left - trackRect.left)
        : Math.max(0, targetRect.right - trackRect.left - viewport.clientWidth);
      viewport.dataset.uiWorkspaceWidth = width;
      track.style.setProperty('--ui-workspace-offset', `${offset}px`);
    };

    const handleResize = () => {
      window.cancelAnimationFrame(resizeFrame);
      resizeFrame = window.requestAnimationFrame(align);
    };
    window.addEventListener('resize', handleResize);

    return {
      get stage() { return currentStage; },
      is(stage) { return currentStage === stage; },
      align,
      set(stage) {
        if (!(stage in stages)) throw new Error(`Unknown workspace stage: ${stage}`);
        track.dataset.uiWorkspaceStage = stage;
        currentStage = stage;
        align();
      },
    };
  }

  function createFeatureWorkspaceController(track) {
    const selector = '[data-ui-feature-workspace]';
    const workspaces = () => Array.from(track.querySelectorAll(`:scope > ${selector}`));
    const activate = (name) => {
      workspaces().forEach((workspace) => {
        workspace.hidden = workspace.dataset.uiFeatureWorkspace !== name;
      });
    };

    return {
      activate,
      clear() {
        workspaces().forEach((workspace) => { workspace.hidden = true; });
      },
      register(name, workspace) {
        workspace.dataset.uiFeatureWorkspace = name;
        workspace.classList.add('ui-feature-workspace');
        if (workspace.parentElement !== track) track.append(workspace);
        activate(name);
        return workspace;
      },
      remove(name) {
        workspaces()
          .filter((workspace) => workspace.dataset.uiFeatureWorkspace === name)
          .forEach((workspace) => workspace.remove());
      },
    };
  }

  function bindModuleFilters(list, initialState, {onChange = null} = {}) {
    const subtypeByType = {
      element: new Set(['field', 'computed_field', 'action']),
      interface: new Set(['account', 'thread', 'thread_post']),
      layout: new Set(['thread_post', 'profile']),
    };
    const allowedCollections = new Set(['search', 'self', 'editing', 'saved', 'deleted']);
    const state = {
      type: subtypeByType[initialState.type] ? initialState.type : 'element',
      collection: allowedCollections.has(initialState.collection) ? initialState.collection : 'self',
      subtypes: {
        element: subtypeByType.element.has(initialState.subtype) ? initialState.subtype : 'field',
        interface: subtypeByType.interface.has(initialState.subtype) ? initialState.subtype : 'thread',
        layout: subtypeByType.layout.has(initialState.subtype) ? initialState.subtype : 'thread_post',
      },
    };

    const supportsType = (button) => {
      const types = button?.dataset.moduleCollectionTypes?.split(' ');
      return !types || types.includes(state.type);
    };

    const apply = (notify = false) => {
      const collectionButton = list.querySelector(`[data-module-collection="${state.collection}"]`);
      if (!collectionButton || !supportsType(collectionButton)) state.collection = 'self';
      list.querySelectorAll('[data-module-type]').forEach((button) => {
        const active = button.dataset.moduleType === state.type;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', String(active));
      });
      list.querySelectorAll('[data-module-subtypes]').forEach((group) => {
        const activeGroup = group.dataset.moduleSubtypes === state.type;
        group.hidden = !activeGroup;
        group.querySelectorAll('[data-module-subtype]').forEach((button) => {
          const active = activeGroup && button.dataset.moduleSubtype === state.subtypes[state.type];
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-selected', String(active));
        });
      });
      list.querySelectorAll('[data-module-collection]').forEach((button) => {
        button.hidden = !supportsType(button);
        const active = button.dataset.moduleCollection === state.collection;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', String(active));
      });
      const activePanel = state.type === 'element'
        ? `${state.type}:${state.subtypes.element}:${state.collection}`
        : `${state.type}:${state.collection}`;
      list.querySelectorAll('[data-module-panel]').forEach((panel) => {
        panel.classList.toggle('is-active', panel.dataset.modulePanel === activePanel);
      });
      list.querySelectorAll('[data-module-panel^="interface:"] .module-summary-entry').forEach((item) => {
        item.hidden = item.dataset.moduleSubtype !== state.subtypes.interface;
      });
      list.querySelectorAll('[data-module-empty]').forEach((empty) => {
        const panel = empty.closest('[data-module-panel]');
        const hasVisibleItem = Array.from(panel.querySelectorAll('.module-summary-entry')).some((item) => !item.hidden);
        empty.hidden = hasVisibleItem;
      });
      const kindInput = list.querySelector('[data-module-create-kind]');
      if (kindInput) kindInput.value = state.subtypes.interface;
      if (notify && onChange) onChange({
        type: state.type,
        subtype: state.subtypes[state.type],
        collection: state.collection,
      });
    };

    list.querySelectorAll('[data-module-type]').forEach((button) => button.addEventListener('click', () => {
      state.type = button.dataset.moduleType;
      apply(true);
    }));
    list.querySelectorAll('[data-module-subtypes] [data-module-subtype]').forEach((button) => button.addEventListener('click', () => {
      const type = button.closest('[data-module-subtypes]').dataset.moduleSubtypes;
      state.subtypes[type] = button.dataset.moduleSubtype;
      apply(true);
    }));
    list.querySelectorAll('[data-module-collection]').forEach((button) => button.addEventListener('click', () => {
      state.collection = button.dataset.moduleCollection;
      apply(true);
    }));
    apply();
    return {state, apply};
  }

  function bindSummarySearch(root) {
    if (!root || root.dataset.summarySearchBound === 'true') return;
    const form = root.querySelector('[data-summary-search-form]');
    if (!form) return;
    root.dataset.summarySearchBound = 'true';

    const loadResults = async (url, button = null) => {
      const current = root.querySelector('[data-summary-search-results]');
      if (!current) return;
      const pending = button ? beginPendingAction(button, '検索中...') : null;
      current.setAttribute('aria-busy', 'true');
      try {
        const results = await fetchFragment(url, '[data-summary-search-results]');
        current.replaceWith(results);
      } catch {
        current.removeAttribute('aria-busy');
      } finally {
        pending?.restore();
      }
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const url = new URL(form.action, location.origin);
      new FormData(form).forEach((value, key) => {
        if (String(value).trim()) url.searchParams.set(key, value);
      });
      const details = form.closest('details');
      if (details) setAccordionExpanded(details, false);
      loadResults(url, event.submitter);
    });

    root.addEventListener('click', (event) => {
      const link = event.target.closest('[data-summary-page]');
      if (!link || !root.contains(link)) return;
      event.preventDefault();
      loadResults(new URL(link.href, location.origin));
    });
  }

  function bindAccordion(details) {
    if (details.dataset.uiAccordionBound || details.matches('.account-menu, .map-filter, [data-ui-accordion="off"]')) return;
    const summary = details.querySelector(':scope > summary');
    if (!summary) return;
    details.dataset.uiAccordionBound = 'true';

    const content = document.createElement('div');
    content.className = 'ui-accordion-content';
    const inner = document.createElement('div');
    inner.className = 'ui-accordion-content-inner';
    while (summary.nextSibling) inner.append(summary.nextSibling);
    content.append(inner);
    details.append(content);

    const setExpanded = (expanded) => {
      summary.setAttribute('aria-expanded', String(expanded));
      if (expanded) {
        details.open = true;
        requestAnimationFrame(() => content.classList.add('is-open'));
      } else {
        content.classList.remove('is-open');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) details.open = false;
      }
      details.dispatchEvent(new CustomEvent('niixy:accordion-change', {detail: {expanded}}));
    };
    accordionControllers.set(details, {setExpanded});

    if (details.open) content.classList.add('is-open');
    summary.setAttribute('aria-expanded', String(details.open));
    summary.addEventListener('click', (event) => {
      event.preventDefault();
      setExpanded(!content.classList.contains('is-open'));
    });
    content.addEventListener('transitionend', (event) => {
      if (event.propertyName === 'grid-template-rows' && !content.classList.contains('is-open')) details.open = false;
    });
  }

  function bindAccordions(root = document) {
    if (root.matches?.('details')) bindAccordion(root);
    root.querySelectorAll?.('details').forEach(bindAccordion);
  }

  function createExclusivePanels(root, definitions) {
    const panels = new Map(Object.entries(definitions).map(([name, definition]) => {
      const toggle = typeof definition.toggle === 'string' ? root.querySelector(definition.toggle) : definition.toggle;
      const panel = typeof definition.panel === 'string' ? root.querySelector(definition.panel) : definition.panel;
      return [name, {...definition, toggle, panel}];
    }));

    const apply = (item, expanded) => {
      if (!item.toggle || !item.panel) return;
      const wasExpanded = item.panel.classList.contains('is-open');
      item.panel.classList.toggle('is-open', expanded);
      item.panel.setAttribute('aria-hidden', String(!expanded));
      item.toggle.setAttribute('aria-expanded', String(expanded));
      item.toggle.textContent = expanded ? (item.openLabel || 'キャンセル') : item.label;
      if (wasExpanded !== expanded) item[expanded ? 'onOpen' : 'onClose']?.();
    };
    const set = (name, expanded = true) => {
      panels.forEach((item, itemName) => apply(item, expanded && itemName === name));
    };
    const isExpanded = (name) => panels.get(name)?.panel?.classList.contains('is-open') || false;

    panels.forEach((item, name) => {
      if (!item.toggle || !item.panel) return;
      apply(item, item.panel.classList.contains('is-open'));
      item.toggle.addEventListener('click', () => set(name, !isExpanded(name)));
    });
    return {isExpanded, set};
  }

  function setAccordionExpanded(details, expanded) {
    const controller = accordionControllers.get(details);
    if (controller) controller.setExpanded(expanded);
    else details.open = expanded;
  }

  bindAccordions();
  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-explanation-target]');
    if (!trigger) return;
    const scope = trigger.closest('[data-explanation-scope]') || document;
    const dialog = scope.querySelector(trigger.dataset.explanationTarget);
    if (dialog?.showModal) dialog.showModal();
  });
  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-open-thread-policy]');
    if (!trigger) return;
    const policy = trigger.closest('.thread-detail')?.querySelector('.thread-policy-entry');
    if (!policy) return;
    setAccordionExpanded(policy, true);
    window.setTimeout(() => policy.scrollIntoView({behavior: 'smooth', block: 'nearest'}), 0);
  });
  new MutationObserver((mutations) => mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => {
    if (node.nodeType === Node.ELEMENT_NODE) bindAccordions(node);
  }))).observe(document.body, {childList: true, subtree: true});

  return {beginPendingAction, bindAccordions, bindModuleFilters, bindSummarySearch, bindTabs, createExclusivePanels, createFeatureWorkspaceController, createPaneStack, createStatusPane, createWorkspace, fetchFragment, setAccordionExpanded, showPaneError, submitThreadReply};
})();
</script>
