{% if rating_url %}<section class="content-feedback{% if compact %} content-feedback-compact{% endif %}" data-content-feedback data-content-kind="{{ kind }}" data-content-target="{{ target_id }}" data-content-sentiment="{{ sentiment }}" data-rating-url="{{ rating_url }}">
  <form method="post" action="{{ rating_url }}" data-content-rating-form>{% csrf_token %}
    {% include 'shared/content_rating_control.html' with rating='fav' count=fav_count %}
    {% include 'shared/content_rating_control.html' with rating='bad' count=bad_count %}
    <button class="button secondary content-feedback-add" type="button" data-account-list-picker-url="{{ picker_url }}"{% if not can_rate %} disabled{% endif %}>追加</button>
    <p class="account-list-error" role="alert" hidden></p>
  </form>
</section>{% endif %}
