<section class="account-list-content" data-content-list-kind="{{ kind }}" data-account-list-picker data-list-fetch-url="{{ summary_page_url }}" data-list-title="追加先を選択">
  <p>{{ target.name }} を追加する{{ list_label }}を選択してください。</p>
  <div class="ui-summary-list">{% for list in summary_page %}<form method="post" action="{{ list.add_url }}" data-account-list-form data-list-operation="pick" data-account-list-id="{{ list.pk }}" data-content-list-kind="{{ kind }}">{% csrf_token %}<input type="hidden" name="target_url" value="{{ target_url }}"><button class="button secondary account-list-pick" type="submit" data-list-label="{{ list.name }}" data-reference-count="{{ list.reference_count }}">{{ list.name }} ({{ list.reference_count }}) に追加</button><a href="{{ list.page_url }}">Listを開く</a><p class="account-list-error" role="alert" hidden></p><p data-list-success role="status" hidden></p></form>{% empty %}<p class="empty">下で{{ list_label }}を作成できます。</p>{% endfor %}</div>
  {% include 'shared/summary_pagination.html' %}
  <form method="post" action="{{ create_url }}" data-account-list-form data-list-operation="create">{% csrf_token %}<input type="hidden" name="submission_id" value="{{ submission_id }}"><input type="hidden" name="target_url" value="{{ target_url }}"><label>新しい{{ list_label }}名<input name="name" maxlength="{{ max_length }}" required></label><button class="button secondary" type="submit">Listを作成して追加</button><p class="account-list-error" role="alert" hidden></p></form>
  <details class="account-list-share"><summary>URLを共有</summary><label>対象のURL<input data-list-share-url value="{{ target_url }}" readonly></label><button class="button secondary" type="button" data-copy-list-url>URLをコピー</button><p data-list-share-status role="status" hidden></p><p>このURLをブラウザに貼ると直接表示できます。List内の「URLから追加」で参照を追加できます。</p></details>
</section>
