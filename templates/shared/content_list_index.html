<section class="account-list-content" data-content-list-kind="{{ kind }}" data-account-lists-index data-list-fetch-url="{{ summary_page_url }}" data-list-title="{{ list_label }}一覧">
  <div class="ui-summary-list">{% for list in summary_page %}<a class="account-list-summary muter-summary" href="{{ list.page_url }}" data-account-list-id="{{ list.pk }}" data-content-list-kind="{{ kind }}"><span>{{ list.name }}</span><span><span data-list-count>{{ list.reference_count }}</span> 参照 · {{ list.created_at|date:'Y/m/d' }}</span></a>{% empty %}<p class="empty">まだ{{ list_label }}はありません。</p>{% endfor %}</div>
  {% include 'shared/summary_pagination.html' %}
  {% if is_list_owner %}<form method="post" action="{{ create_url }}" data-account-list-form data-list-operation="create">{% csrf_token %}<input type="hidden" name="submission_id" value="{{ submission_id }}"><label>新しい{{ list_label }}名<input name="name" maxlength="{{ max_length }}" required></label><button class="button secondary" type="submit">Listを作成</button><p class="account-list-error" role="alert" hidden></p></form>{% endif %}
</section>
